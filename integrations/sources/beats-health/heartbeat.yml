heartbeat.monitors:
  - type: http
    name: Kibana
    urls: ["http://ELK_SERVER_IP:5601"]
    schedule: '@every 30s'

  - type: icmp
    name: Ping DC
    hosts: ["DC_IP"]
    schedule: '@every 30s'

output.logstash:
  hosts: ["ELK_SERVER_IP:5046"]
  ssl.enabled: false
  # TLS (Logstash with BEATS_TLS=true): prepare-share.ps1 -CaCert sets these for you
  #ssl.enabled: true
  #ssl.certificate_authorities: ["C:/ProgramData/Elastic/Beats/esm-ca.crt"]

# Pipeline: beats-health
# Input:  Metricbeat and Heartbeat, beats on 5046/tcp
# Output: Metricbeat -> data stream metrics-metricbeat-<namespace>
#         Heartbeat  -> data stream logs-heartbeat-<namespace>
#         anything else on this port -> logs-beats_unknown-<namespace> (kept, not dropped)
#
# Routing uses the event's data_stream.* fields (data_stream_auto_routing).

input {
  beats {
    id   => "beats_health_5046"
    port => 5046
    # TLS from the Beats when BEATS_TLS=true (integrations/sources/README.md#tls-from-the-beats).
    # Logstash checks that both paths exist even with TLS off, so they default to the ES CA that
    # every Logstash host has; it is only read when TLS is on.
    ssl_enabled     => "${BEATS_TLS:false}"
    ssl_certificate => "${BEATS_TLS_CERT:/etc/logstash/certs/ca.crt}"
    ssl_key         => "${BEATS_TLS_KEY:/etc/logstash/certs/ca.crt}"
  }
}

filter {
  if [agent][type] == "metricbeat" {
    mutate { replace => { "[data_stream][type]" => "metrics" "[data_stream][dataset]" => "metricbeat" } }
  } else if [agent][type] == "heartbeat" {
    mutate { replace => { "[data_stream][type]" => "logs" "[data_stream][dataset]" => "heartbeat" } }
  } else {
    mutate {
      add_tag => ["_unexpected_agent"]
      replace => { "[data_stream][type]" => "logs" "[data_stream][dataset]" => "beats_unknown" }
    }
  }
  mutate {
    replace => {
      "[data_stream][namespace]" => "${ES_NAMESPACE:default}"
      "[event][module]"          => "%{[data_stream][dataset]}"
      "[event][dataset]"         => "%{[data_stream][dataset]}"
    }
  }
}

output {
  elasticsearch {
    id                          => "beats_health_es"
    hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
    user                        => "${ES_USER:logstash_ingest}"
    password                    => "${ES_PW}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
    data_stream                 => true
    data_stream_auto_routing    => true
  }
}

# Pipeline: paloalto-beats
# Input:  Filebeat with the panw module, beats on 5044/tcp
#         (PAN-OS -> rsyslog collector -> file -> Filebeat; see collector/)
# Output: data stream logs-paloalto-<namespace>
#
# The panw module parses events in an Elasticsearch ingest pipeline. Filebeat puts that
# pipeline's name in [@metadata][pipeline]; content/bootstrap.sh loads it for the stack version
# (BEATS_VERSIONS for others, see integrations/sources/README.md).

input {
  beats {
    id   => "paloalto_beats_5044"
    port => 5044
  }
}

filter {
  mutate {
    add_tag   => ["paloalto", "network", "firewall"]
    add_field => { "[observer][vendor]" => "Palo Alto Networks" }
  }
}

output {
  if [@metadata][pipeline] {
    elasticsearch {
      id                          => "paloalto_beats_es_pipeline"
      hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
      user                        => "${ES_USER:logstash_ingest}"
      password                    => "${ES_PW}"
      ssl_enabled                 => true
      ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
      pipeline                    => "%{[@metadata][pipeline]}"
      data_stream                 => true
      data_stream_auto_routing    => false
      data_stream_type            => "logs"
      data_stream_dataset         => "paloalto"
      data_stream_namespace       => "${ES_NAMESPACE:default}"
    }
  } else {
    elasticsearch {
      id                          => "paloalto_beats_es"
      hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
      user                        => "${ES_USER:logstash_ingest}"
      password                    => "${ES_PW}"
      ssl_enabled                 => true
      ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
      data_stream                 => true
      data_stream_auto_routing    => false
      data_stream_type            => "logs"
      data_stream_dataset         => "paloalto"
      data_stream_namespace       => "${ES_NAMESPACE:default}"
    }
  }
}

# Pipeline: windows
# Input:  Winlogbeat, beats on 5045/tcp. Two deployment styles share this port:
#         - Winlogbeat on every endpoint (GPO rollout, deploy/endpoints/windows)
#         - Winlogbeat on a Windows Event Collector (WEC) reading the ForwardedEvents channel (WEF)
# Output: data stream logs-windows-<namespace>
#
# The translate dictionary is read from ${LS_SOURCES_DIR}/windows/translate/windows_event_codes.yml
# (LS_SOURCES_DIR defaults to /etc/logstash/conf.d, where the installer and the container mount it).

input {
  beats {
    id   => "windows_beats_5045"
    port => 5045
  }
}

filter {
  mutate {
    add_tag   => ["windows"]
    add_field => { "[event][module]" => "windows" "[event][dataset]" => "windows" }
  }

  # WEF: events arrive through a collector; the original computer is winlog.computer_name
  if [winlog][channel] == "ForwardedEvents" {
    mutate {
      add_tag => ["wef"]
      copy    => { "[host][name]" => "[observer][hostname]" }
    }
    if [winlog][computer_name] {
      mutate { replace => { "[host][name]" => "%{[winlog][computer_name]}" } }
    }
  }

  # Winlogbeat sets event.action for many Security events; fill it only where it is missing
  if [event][code] and ![event][action] {
    translate {
      id               => "windows_event_code_action"
      source           => "[event][code]"
      target           => "[event][action]"
      dictionary_path  => "${LS_SOURCES_DIR:/etc/logstash/conf.d}/windows/translate/windows_event_codes.yml"
      refresh_interval => 300
      fallback         => "windows-event"
    }
  }

  if [winlog][provider_name] {
    mutate { copy => { "[winlog][provider_name]" => "[event][provider]" } }
  }
}

# Winlogbeat 8.x parses Security, Sysmon and PowerShell events in Elasticsearch ingest pipelines
# (process.*, event.category, user.* ...). Winlogbeat puts the pipeline name in [@metadata][pipeline];
# content/bootstrap.sh loads them for the stack version (BEATS_VERSIONS for others, see
# integrations/sources/README.md). Without them the detection rules cannot match.
output {
  if [@metadata][pipeline] {
    elasticsearch {
      id                          => "windows_es_pipeline"
      hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
      user                        => "${ES_USER:logstash_ingest}"
      password                    => "${ES_PW}"
      ssl_enabled                 => true
      ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
      pipeline                    => "%{[@metadata][pipeline]}"
      data_stream                 => true
      data_stream_auto_routing    => false
      data_stream_type            => "logs"
      data_stream_dataset         => "windows"
      data_stream_namespace       => "${ES_NAMESPACE:default}"
    }
  } else {
    elasticsearch {
      id                          => "windows_es"
      hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
      user                        => "${ES_USER:logstash_ingest}"
      password                    => "${ES_PW}"
      ssl_enabled                 => true
      ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
      data_stream                 => true
      data_stream_auto_routing    => false
      data_stream_type            => "logs"
      data_stream_dataset         => "windows"
      data_stream_namespace       => "${ES_NAMESPACE:default}"
    }
  }
}

# Pipeline: kaspersky
# Input:  Filebeat shipping the Kaspersky Security Center syslog export, beats on 5047/tcp
# Output: data stream logs-kaspersky-<namespace>
#
# The port is dedicated to this source, so every event received here is treated as Kaspersky.
# Message parsing (CEF/LEEF depending on the KSC export setting) is not implemented yet.

input {
  beats {
    id   => "kaspersky_beats_5047"
    port => 5047
    # TLS from the Beats when BEATS_TLS=true (integrations/sources/README.md#tls-from-the-beats).
    # Logstash checks that both paths exist even with TLS off, so they default to the ES CA that
    # every Logstash host has; it is only read when TLS is on.
    ssl_enabled     => "${BEATS_TLS:false}"
    ssl_certificate => "${BEATS_TLS_CERT:/etc/logstash/certs/ca.crt}"
    ssl_key         => "${BEATS_TLS_KEY:/etc/logstash/certs/ca.crt}"
  }
}

filter {
  mutate {
    add_tag   => ["kaspersky", "av", "endpoint"]
    add_field => {
      "[event][module]"    => "kaspersky"
      "[event][dataset]"   => "kaspersky"
      "[observer][vendor]" => "Kaspersky"
      "[observer][product]" => "Kaspersky Security Center"
    }
  }
}

output {
  elasticsearch {
    id                          => "kaspersky_es"
    hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
    user                        => "${ES_USER:logstash_ingest}"
    password                    => "${ES_PW}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
    data_stream                 => true
    data_stream_auto_routing    => false
    data_stream_type            => "logs"
    data_stream_dataset         => "kaspersky"
    data_stream_namespace       => "${ES_NAMESPACE:default}"
  }
}

# Pipeline: kaspersky
# Input:  Filebeat shipping the Kaspersky Security Center syslog export, beats on 5047/tcp
# Output: data stream logs-kaspersky-<namespace>
#
# The port is dedicated to this source, so every event received here is treated as Kaspersky.
# KSC exports events to a SIEM as CEF or LEEF (Administration Server properties -> SIEM); both are
# parsed into ECS. Vendor fields (csN with csNLabel, LEEF keys without an ECS field) are kept under
# kaspersky.*. Samples and expected fields: tests/pipelines/kaspersky.yml.

input {
  beats {
    id   => "kaspersky_beats_5047"
    port => 5047
    # TLS from the Beats when BEATS_TLS=true (integrations/sources/README.md#tls-from-the-beats).
    # Logstash checks that both paths exist even with TLS off, so they default to the ES CA that
    # every Logstash host has; it is only read when TLS is on.
    ssl_enabled     => "${BEATS_TLS:false}"
    ssl_certificate => "${BEATS_TLS_CERT:/etc/logstash/certs/ca.crt}"
    ssl_key         => "${BEATS_TLS_KEY:/etc/logstash/certs/ca.crt}"
  }
}

filter {
  mutate {
    add_tag   => ["kaspersky", "av", "endpoint"]
    add_field => {
      "[event][module]"    => "kaspersky"
      "[event][dataset]"   => "kaspersky"
      "[observer][vendor]" => "Kaspersky"
      "[observer][product]" => "Kaspersky Security Center"
    }
  }

  # Filebeat runs on the machine that receives the KSC export and describes that machine in host.*;
  # the affected endpoint comes from the record, so the shipper becomes the observer
  if [host][name] {
    mutate { id => "kaspersky_shipper" rename => { "[host][name]" => "[observer][hostname]" } }
    mutate { remove_field => ["[host]"] }
  }

  # The KSC export may put a syslog header in front of the CEF/LEEF record
  grok {
    id             => "kaspersky_record"
    match          => { "message" => "(?<[@metadata][record]>(?:CEF|LEEF):[0-9.]+\|.*)$" }
    tag_on_failure => ["kaspersky_unparsed"]
  }

  if [@metadata][record] {
    ruby {
      id   => "kaspersky_cef_leef"
      code => '
        rec = event.get("[@metadata][record]")
        bs = 92.chr  # a backslash, kept out of the regex literals below
        if rec.start_with?("CEF:")
          # CEF:Version|Vendor|Product|Version|SignatureID|Name|Severity|Extension
          # A pipe preceded by a backslash is part of a header value
          parts = rec.split(Regexp.new("(?<!" + Regexp.escape(bs) + ")[|]"), 8)
          if parts.length == 8
            event.set("[observer][version]", parts[3])
            event.set("[event][code]", parts[4])
            event.set("[event][reason]", parts[5].gsub(bs + "|", "|"))
            event.set("[@metadata][severity]", parts[6])
            ext = {}
            # key=value pairs separated by spaces; values may hold spaces and escaped characters
            pair = Regexp.new("([A-Za-z0-9_.]+)=((?:" + Regexp.escape(bs) + ".|[^" + Regexp.escape(bs) +
                              "])*?)(?=[ ]+[A-Za-z0-9_.]+=|[ ]*\\z)", Regexp::MULTILINE)
            unescape = Regexp.new(Regexp.escape(bs) + "(.)")
            parts[7].scan(pair) do |k, v|
              ext[k] = v.gsub(unescape) { { "n" => 10.chr, "r" => 13.chr }.fetch($1, $1) }
            end
            event.set("[@metadata][ext]", ext)
          else
            event.tag("kaspersky_unparsed")
          end
        else
          # LEEF:1.0|Vendor|Product|Version|EventID|<key=value separated by tabs>
          # LEEF:2.0|Vendor|Product|Version|EventID|<delimiter>|<key=value separated by it>
          parts = rec.split("|", 6)
          if parts.length == 6
            event.set("[observer][version]", parts[3])
            event.set("[event][code]", parts[4])
            delim = 9.chr
            body = parts[5]
            if parts[0].start_with?("LEEF:2") && (m = body.match(/\A([^|]{1,6})[|]/))
              d = m[1]
              delim = d =~ /\A(?:0x|x)\h{2}\z/i ? d[-2..].hex.chr : d
              body = m.post_match
            end
            ext = {}
            body.split(delim).each do |kv|
              k, v = kv.split("=", 2)
              ext[k.strip] = v if k && v
            end
            event.set("[@metadata][ext]", ext)
            event.set("[@metadata][severity]", ext["sev"] || ext["vSeverity"])
          else
            event.tag("kaspersky_unparsed")
          end
        end
      '
    }
  }

  if [@metadata][ext] {
    ruby {
      id   => "kaspersky_ecs"
      code => '
        ext = event.get("[@metadata][ext]")
        ecs = {
          "dhost" => "[host][name]", "shost" => "[host][name]", "dvchost" => "[host][name]",
          "dst" => "[host][ip]", "dvc" => "[host][ip]", "src" => "[source][ip]",
          "duser" => "[user][name]", "suser" => "[user][name]", "usrName" => "[user][name]",
          "fname" => "[file][name]", "filePath" => "[file][path]", "fileHash" => "[file][hash][md5]",
          "act" => "[event][action]", "dproc" => "[process][executable]",
          "sproc" => "[process][executable]",
        }
        skip = %w[rt devTime devTimeFormat sev vSeverity msg]
        ext.each do |k, v|
          next if v.nil? || v.empty? || k =~ /\Acs\d+Label\z/ || skip.include?(k)
          if (m = k.match(/\Acs(\d+)\z/))
            label = ext["cs#{m[1]}Label"] || "cs#{m[1]}"
            event.set("[kaspersky][#{label.gsub(/[^A-Za-z0-9]+/, "_").downcase}]", v)
          elsif ecs.key?(k)
            event.set(ecs[k], v) if event.get(ecs[k]).nil?
          else
            event.set("[kaspersky][#{k.gsub(/[^A-Za-z0-9]+/, "_")}]", v)
          end
        end
        time = ext["rt"] || ext["devTime"]
        event.set("[@metadata][time]", time) if time
        if ext["msg"] && !ext["msg"].empty?
          event.set("[event][original]", event.get("message"))
          event.set("message", ext["msg"])
        end
      '
    }

    if [@metadata][time] {
      date {
        id             => "kaspersky_time"
        match          => ["[@metadata][time]", "UNIX_MS", "MMM dd yyyy HH:mm:ss", "MMM dd yyyy HH:mm:ss.SSS", "ISO8601"]
        tag_on_failure => ["kaspersky_time_unparsed"]
      }
    }
    if [@metadata][severity] =~ /^[0-9]+$/ {
      mutate { id => "kaspersky_severity" add_field => { "[event][severity]" => "%{[@metadata][severity]}" } }
      mutate { convert => { "[event][severity]" => "integer" } }
    }
    if [host][name] {
      mutate { id => "kaspersky_host_lower" lowercase => ["[host][name]"] }
    }

    # Detections become alerts; cleaned or removed objects stay events (KSC event type IDs)
    if [event][code] in ["GNRL_EV_VIRUS_FOUND", "GNRL_EV_SUSPICIOUS_OBJECT_FOUND", "GNRL_EV_OBJECT_NOT_CURED", "GNRL_EV_VIRUS_OUTBREAK", "GNRL_EV_PASSWORD_ARCHIVE_FOUND"] {
      mutate { add_field => { "[event][kind]" => "alert" "[event][category]" => "malware" "[event][type]" => "info" } }
    } else if [event][code] == "GNRL_EV_ATTACK_DETECTED" {
      mutate { add_field => { "[event][kind]" => "alert" "[event][category]" => "intrusion_detection" "[event][type]" => "info" } }
    } else if [event][code] in ["GNRL_EV_OBJECT_CURED", "GNRL_EV_OBJECT_DELETED", "GNRL_EV_OBJECT_QUARANTINED"] {
      mutate { add_field => { "[event][kind]" => "event" "[event][category]" => "malware" "[event][type]" => "deletion" "[event][outcome]" => "success" } }
    } else {
      mutate { add_field => { "[event][kind]" => "event" } }
    }
  }
}

output {
  elasticsearch {
    id                          => "kaspersky_es"
    hosts                       => ["${ES_HOSTS:https://localhost:9200}"]
    user                        => "${ES_USER:logstash_ingest}"
    password                    => "${ES_PW}"
    ssl_enabled                 => true
    ssl_certificate_authorities => ["${ES_CA_CERT:/etc/logstash/certs/ca.crt}"]
    data_stream                 => true
    data_stream_auto_routing    => false
    data_stream_type            => "logs"
    data_stream_dataset         => "kaspersky"
    data_stream_namespace       => "${ES_NAMESPACE:default}"
  }
}

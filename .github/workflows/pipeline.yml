name: CI/CD · DevSecOps

# One pipeline for every change. Flow: feature branch -> PR into staging -> PR staging -> production.
# Sized for a small open-source project (ADR-026): cheap checks on every change, the slow ones
# where they add information.
#
#   0 guard     promotion rule (only staging or hotfix/* may open PRs into production)
#   1 quality   lint (gofmt, go vet, golangci-lint+gosec, ruff, hadolint, shellcheck, actionlint),
#               secret scan (gitleaks, full history)
#   2 verify    unit tests (Go, Python), content + manifest validation,
#               SAST (CodeQL), SCA (govulncheck, pip-audit, dependency review), IaC (Trivy)
#   3 build     container images; image scan (Trivy) on the weekly run and by hand
#   4 e2e       end-to-end pipeline test on the compose stack, on promotion PRs into production
#               and by hand: the production ruleset requires an up-to-date branch, so the merge
#               result is the tree the PR already tested
#   5 gate      single required status check for the branch rulesets
#   6 release   push to staging/production only: publish images to GHCR. No deploy target yet.
#
# The LLM is always mocked; the billed API is never called (design rule 7, ROADMAP.md).
# Findings are uploaded as SARIF to the Security tab; HIGH/CRITICAL findings fail the pipeline.
#
# What runs when:
#   pull_request   everything up to the gate (e2e only on PRs into production)
#   push           quality, verify, build, release
#   schedule       secrets, SAST, SCA, IaC, image scans: rules and advisories change, code does not

on:
  pull_request:
    branches: [staging, production]
  push:
    branches: [staging, production]
  schedule:
    - cron: "17 3 * * 1"   # weekly re-scan of production for new advisories and new SAST rules
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27"
  PYTHON_VERSION: "3.14"
  LLM_PROVIDER: mock
  TRIVY_VERSION: v0.75.0
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/elastic-genai-secops

jobs:
  # ---------------------------------------------------------------------------------------------
  # 0 · guard
  # ---------------------------------------------------------------------------------------------
  promotion:
    name: Guard · promotion path
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Only staging or hotfix/* may be merged into production
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [ "$BASE" = production ] && [ "$HEAD" != staging ] && [ "${HEAD#hotfix/}" = "$HEAD" ]; then
            echo "::error::PRs into production must come from staging (or hotfix/*), not '$HEAD'. Open the PR against staging."
            exit 1
          fi
          echo "$HEAD -> $BASE: allowed"

  # ---------------------------------------------------------------------------------------------
  # 1 · quality
  # ---------------------------------------------------------------------------------------------
  lint:
    name: Lint · Go, Python, Dockerfiles, shell, workflows
    if: github.event_name != 'schedule'   # unchanged code gives the same result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true   # latest patch of GO_VERSION, not the runner cache (stdlib CVEs)
      - name: Go version matches the images
        # Dependabot bumps the golang base image; CI must test with the toolchain that builds it
        run: |
          images="$(grep -h '^FROM golang:' services/*/Dockerfile | awk '{print $2}' | sort -u)"
          if [ "$images" != "golang:${GO_VERSION}-alpine" ]; then
            echo "::error::GO_VERSION=${GO_VERSION} but the Dockerfiles use: ${images//$'\n'/ }"
            exit 1
          fi
      - name: gofmt
        run: test -z "$(gofmt -l libs services)" || (gofmt -l libs services; exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint (includes gosec)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14   # must be built with a Go >= go.mod's version; linters in .golangci.yml
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: ruff
        run: pip install ruff==0.16.10 && ruff check libs/py-common integrations/outbound services/
      - name: hadolint
        # DL3042 (pip cache) is a false positive: the cache is a BuildKit cache mount, not an image layer
        run: |
          rc=0
          for f in services/*/Dockerfile; do
            echo "-- $f"
            docker run --rm -i hadolint/hadolint:v2.12.0 hadolint --ignore DL3042 --failure-threshold warning - < "$f" || rc=1
          done
          exit $rc
      - name: shellcheck
        run: shellcheck -S warning content/bootstrap.sh content/elasticsearch/beats-pipelines.sh deploy/baremetal/ubuntu/elk_setup_ubuntu_jammy.sh deploy/compose/init-env.sh deploy/kubernetes/init-secrets.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12

  secrets:
    name: Secrets · gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git /repo --redact --verbose --exit-code 1

  # ---------------------------------------------------------------------------------------------
  # 2 · verify
  # ---------------------------------------------------------------------------------------------
  test-go:
    name: Test · Go
    if: github.event_name != 'schedule'   # unchanged code gives the same result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true   # latest patch of GO_VERSION, not the runner cache (stdlib CVEs)
      - name: go test (race, coverage)
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          echo "Go coverage: $(go tool cover -func=coverage.out | tail -1 | awk '{print $3}')" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-go
          path: coverage.out
          retention-days: 7

  test-python:
    name: Test · ${{ matrix.path }}
    if: github.event_name != 'schedule'   # unchanged code gives the same result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        path: [services/masking-service, services/enrichment-service, services/llm-orchestrator,
               services/mcp-server, services/outbound-service, integrations/outbound]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install
        env:
          TARGET: ${{ matrix.path }}
        run: |
          pkgs=(-e libs/py-common -e "integrations/outbound[dev]")
          [ "$TARGET" = integrations/outbound ] || pkgs+=(-e "${TARGET}[dev]")
          pip install pytest-cov "${pkgs[@]}"
      - name: pytest (coverage)
        working-directory: ${{ matrix.path }}
        run: python -m pytest -q --cov --cov-report=term tests

  content:
    name: Validate · rules, compose, Kubernetes
    if: github.event_name != 'schedule'   # unchanged code gives the same result
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true   # latest patch of GO_VERSION, not the runner cache (stdlib CVEs)
      - run: pip install pyyaml
      - name: Detection rules are built from rules.yml
        run: python content/detection-rules/build.py --check
      - name: Compose files
        run: |
          cd deploy/compose
          cp .env.example .env && sed -i 's/__GENERATE__/ci-placeholder-0123456789abcdef/' .env
          docker compose -f siem.yml -f platform.yml config --quiet
      - name: Kubernetes overlays (kustomize + kubeconform, ECK CRD schemas)
        run: |
          ECK=3.5.0
          curl -sSfL "https://download.elastic.co/downloads/eck/${ECK}/crds.yaml" -o /tmp/crds.yaml
          python - <<'EOF'
          import json, pathlib, yaml
          out = pathlib.Path("/tmp/schemas")
          def strict(n):
              if isinstance(n, dict):
                  if n.get("type") == "object" and "properties" in n and "additionalProperties" not in n \
                          and not n.get("x-kubernetes-preserve-unknown-fields"):
                      n["additionalProperties"] = False
                  for v in n.values(): strict(v)
              elif isinstance(n, list):
                  for v in n: strict(v)
              return n
          for d in yaml.safe_load_all(open("/tmp/crds.yaml")):
              if not d or d.get("kind") != "CustomResourceDefinition": continue
              for v in d["spec"]["versions"]:
                  s = strict(v["schema"]["openAPIV3Schema"]); s.setdefault("properties", {})
                  s["properties"].update(apiVersion={"type": "string"}, kind={"type": "string"},
                                         metadata={"type": "object"})
                  p = out / d["spec"]["group"] / f"{d['spec']['names']['kind'].lower()}_{v['name']}.json"
                  p.parent.mkdir(parents=True, exist_ok=True); p.write_text(json.dumps(s))
          EOF
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          # Optional components are checked on top of the overlay they are meant for
          mkdir -p deploy/kubernetes/overlays/onprem-snapshots-s3
          printf 'resources: [../onprem]\ncomponents: [../../components/snapshots-s3]\n' \
            > deploy/kubernetes/overlays/onprem-snapshots-s3/kustomization.yaml
          for o in lab onprem gke onprem-snapshots-s3; do
            [ "$o" = onprem-snapshots-s3 ] || sh deploy/kubernetes/init-secrets.sh "$o"   # uses onprem's
            kubectl kustomize --load-restrictor LoadRestrictionsNone "deploy/kubernetes/overlays/$o" \
              | "$(go env GOPATH)/bin/kubeconform" -strict -summary -kubernetes-version 1.31.0 \
                  -schema-location default \
                  -schema-location '/tmp/schemas/{{ .Group }}/{{ .ResourceKind }}_{{ .ResourceAPIVersion }}.json'
          done

  sast-codeql:
    name: SAST · CodeQL · ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [go, python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true   # latest patch of GO_VERSION, not the runner cache (stdlib CVEs)
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.language == 'go' && 'autobuild' || 'none' }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: codeql-${{ matrix.language }}

  sca:
    name: SCA · govulncheck, pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true   # latest patch of GO_VERSION, not the runner cache (stdlib CVEs)
      - name: govulncheck (reachable Go vulnerabilities)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit (all Python services and libraries)
        run: |
          python -m venv /tmp/audit && . /tmp/audit/bin/activate
          pip install -q --upgrade pip pip-audit==2.10.1
          pip install -q ./libs/py-common ./integrations/outbound services/masking-service \
            services/enrichment-service services/llm-orchestrator services/mcp-server services/outbound-service
          pip-audit --progress-spinner off --desc

  dependency-review:
    name: SCA · dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  iac:
    name: IaC · Trivy misconfiguration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: trivy config (Dockerfiles, Kubernetes, compose)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-iac.sarif
          limit-severities-for-sarif: true   # otherwise SARIF mode ignores the severity filter
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-iac.sarif') != ''
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  # ---------------------------------------------------------------------------------------------
  # 3 · build
  # ---------------------------------------------------------------------------------------------
  build:
    name: Build · ${{ matrix.service }}
    needs: [lint, test-go, test-python]
    if: ${{ !cancelled() && !failure() }}   # lint/tests are skipped on the weekly scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # image-scan SARIF on the weekly run
    strategy:
      fail-fast: false
      matrix:
        service: [detection-service, alert-gateway, case-service, bff,
                  masking-service, enrichment-service, llm-orchestrator, mcp-server,
                  outbound-service]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          load: true
          # Same tag as deploy/compose/platform.yml, so the e2e job runs these exact images
          tags: esm/${{ matrix.service }}:dev
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      # Base images change between releases, our code does not: scan weekly and on demand.
      - name: Image scan · Trivy (fails on HIGH/CRITICAL with a fix available)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          image-ref: esm/${{ matrix.service }}:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          limit-severities-for-sarif: true
          exit-code: "1"
      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: always() && hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image-${{ matrix.service }}
      - name: Export image for the e2e and release jobs
        run: docker save esm/${{ matrix.service }}:dev | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: image.tar.gz
          retention-days: 3

  # ---------------------------------------------------------------------------------------------
  # 4 · e2e on the running compose stack (promotion PRs into production, or by hand)
  # ---------------------------------------------------------------------------------------------
  e2e:
    name: E2E · compose stack
    needs: [build, content]
    if: >-
      ${{ !cancelled() && !failure() && (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.base_ref == 'production')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: /tmp/images
      - name: Load images
        run: for f in /tmp/images/*/image.tar.gz; do gunzip -c "$f" | docker load; done
      - name: Start siem + platform (mock LLM)
        working-directory: deploy/compose
        run: |
          sudo sysctl -w vm.max_map_count=262144
          sh init-env.sh
          docker compose -f siem.yml -f platform.yml up -d --no-build
      - name: Wait for Elasticsearch and the bff
        run: |
          pw="$(grep '^ELASTIC_PASSWORD=' deploy/compose/.env | cut -d= -f2-)"
          for _ in $(seq 90); do
            curl -skf -u "elastic:$pw" "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null \
              && curl -sf http://localhost:8080/healthz >/dev/null && { echo "stack is up"; exit 0; }
            sleep 10
          done
          echo "::error::stack did not come up"; exit 1
      - name: End-to-end pipeline test (alert -> incident -> masked LLM triage -> case)
        run: python3 tests/e2e/pipeline_test.py
      - name: MCP server test (read-only, masked)
        run: |
          python3 -m venv /tmp/mcp && /tmp/mcp/bin/pip install -q 'mcp>=2.3,<3'
          MCP_TOKEN="$(grep '^MCP_TOKEN=' deploy/compose/.env | cut -d= -f2-)" \
            MCP_URL=http://localhost:8090/mcp /tmp/mcp/bin/python tests/e2e/mcp_client_test.py
      - name: Collect stack logs
        if: always()
        working-directory: deploy/compose
        run: docker compose -f siem.yml -f platform.yml logs --no-color > ../../stack-logs.txt 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-logs
          path: stack-logs.txt
          retention-days: 14

  # ---------------------------------------------------------------------------------------------
  # 5 · gate: the single required status check for the staging and production rulesets
  # ---------------------------------------------------------------------------------------------
  gate:
    name: Pipeline gate
    if: always()
    needs: [promotion, lint, secrets, test-go, test-python, content, sast-codeql,
            sca, dependency-review, iac, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: All required jobs passed (skipped jobs do not apply to this event)
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] in ("failure", "cancelled")}
          for k, r in bad.items(): print(f"::error::{k}: {r}")
          sys.exit(1 if bad else 0)'

  # ---------------------------------------------------------------------------------------------
  # 6 · release (push to staging/production): publish to GHCR. No deploy target yet.
  # ---------------------------------------------------------------------------------------------
  release:
    name: Release · ${{ matrix.service }}
    needs: [gate]
    # !cancelled(): without a status function GitHub adds success(), which is false when any
    # upstream job was skipped (e2e, guard and dependency review are skipped on push)
    if: ${{ !cancelled() && github.event_name == 'push' && needs.gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [detection-service, alert-gateway, case-service, bff,
                  masking-service, enrichment-service, llm-orchestrator, mcp-server,
                  outbound-service]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ matrix.service }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push (production -> latest, staging -> staging; both -> commit SHA)
        env:
          SERVICE: ${{ matrix.service }}
          CHANNEL: ${{ github.ref_name == 'production' && 'latest' || 'staging' }}
        run: |
          gunzip -c image.tar.gz | docker load
          image="${IMAGE_PREFIX,,}/$SERVICE"
          for tag in "${GITHUB_SHA::12}" "$CHANNEL"; do
            docker tag "esm/$SERVICE:dev" "$image:$tag"
            docker push "$image:$tag"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$CHANNEL" | cut -d@ -f2)"
          echo "$SERVICE: $image@$digest" >> "$GITHUB_STEP_SUMMARY"

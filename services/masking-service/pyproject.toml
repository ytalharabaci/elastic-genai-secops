[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "masking-service"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
    "esm-common",
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
    "pydantic>=2.14.1",
    "structlog>=26.1.0",
    "elasticsearch[async]>=8.13,<9",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

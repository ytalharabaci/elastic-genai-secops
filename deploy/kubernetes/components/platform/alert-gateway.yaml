# Replicas share the correlation windows in the NATS bucket esm-correlation (ADR-027).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: alert-gateway }
  template:
    metadata:
      labels: { app.kubernetes.io/name: alert-gateway, app.kubernetes.io/component: platform }
    spec:
      serviceAccountName: esm-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: alert-gateway
          image: esm/alert-gateway
          envFrom:
            - configMapRef: { name: esm-platform-config }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}

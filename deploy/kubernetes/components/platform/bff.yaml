# Analyst API in front of case-service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bff
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: bff }
  template:
    metadata:
      labels: { app.kubernetes.io/name: bff, app.kubernetes.io/component: platform }
    spec:
      serviceAccountName: esm-platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bff
          image: esm/bff
          envFrom:
            - configMapRef: { name: esm-platform-config }
          env:
            - { name: LISTEN_ADDR, value: ":8080" }
            - name: ANALYST_TOKENS
              valueFrom: { secretKeyRef: { name: esm-secrets, key: ANALYST_TOKENS } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 384Mi }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: bff
spec:
  selector: { app.kubernetes.io/name: bff }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
